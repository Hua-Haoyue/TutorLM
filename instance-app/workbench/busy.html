<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TutorLM · 暂时满载</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%23111%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/tokens.css">
<script>
  /* Apply the saved/system theme before first paint to avoid a flash. */
  (function () {
    try {
      var t = localStorage.getItem('tlm.theme');
      if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();

</script>
<style>
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .wrap { width: 100%; max-width: 1200px; margin: 0 auto; padding: 0 48px; }
  .top { border-bottom: 1px solid var(--line); }
  .top .wrap { height: 56px; display: flex; align-items: center; gap: 16px; }
  .theme-btn { margin-left: auto; color: var(--muted); }
  .theme-btn:hover { color: var(--ink); }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.02em; font-size: 15px; text-decoration: none; color: var(--ink); }
  .logo b { width: 22px; height: 22px; background: var(--ink); color: var(--paper); display: grid; place-items: center; font-size: 12px; }

  main { flex: 1; display: flex; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 24px; padding: 72px 0; }
  .code { grid-column: 1 / 3; padding-top: 14px; }
  .body { grid-column: 3 / 9; }
  .side { grid-column: 9 / 13; }
  h1 { margin: 0; font-size: clamp(36px, 5vw, 60px); line-height: 1.06; font-weight: 600; letter-spacing: -0.04em; }
  .lede { margin: 24px 0 36px; font: 400 18px/1.7 var(--serif); color: var(--ink-2); max-width: 30em; }

  .count { border-top: 1px solid var(--ink); padding-top: 12px; }
  .count__num { font: 500 64px/1 var(--mono); letter-spacing: -0.04em; margin: 12px 0; font-variant-numeric: tabular-nums; }
  .track { height: 2px; background: var(--paper-3); }
  .track i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 1s linear; }
  .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 24px; }

  dl { margin: 0; }
  .row { display: grid; grid-template-columns: 1fr auto; padding: 10px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .row:last-child { border-bottom: 1px solid var(--line); }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: var(--mono); font-size: 12px; }
  .slots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; height: 28px; margin: 12px 0 20px; }
  .slots i { background: var(--ink); }
  .slots i.free { background: transparent; border: 1px solid var(--ink); }
  .slots i.drain { background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 5px); border: 1px solid var(--ink); }
  .legend { display: flex; gap: 14px; font-size: 11px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; vertical-align: -1px; background: var(--ink); }
  .legend .l-free::before { background: transparent; border: 1px solid var(--ink); }
  .legend .l-drain::before { background: repeating-linear-gradient(45deg, var(--ink) 0 1px, transparent 1px 3px); border: 1px solid var(--ink); }

  .ok { display: none; }
  body.is-ok .ok { display: block; }
  body.is-ok .wait { display: none; }

  footer { border-top: 1px solid var(--line); background: var(--paper-2); }
  footer .wrap { height: 44px; display: flex; align-items: center; font-size: 12px; color: var(--muted); gap: 16px; }

  @media (max-width: 900px) {
    .wrap { padding: 0 20px; }
    .code { display: none; }
    .body, .side { grid-column: 1 / -1; }
    .side { margin-top: 48px; }
  }
  /* v3 shape: rounded marks, softer rules (tokens.css supplies rounded buttons/inputs) */
  .logo b { border-radius: var(--r-sm); }
  .chip { border-radius: var(--r-xs); }
  .slots { gap: 4px; }
  .slots i { border-radius: var(--r-xs); }
  .legend span::before { border-radius: 2px; }
  .track { border-radius: 2px; overflow: hidden; }
  .count { border-top-color: var(--line); }
  .ok, .wait { animation: rise .3s var(--ease); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="index.html"><b>T</b>TutorLM</a>
    <span class="chip chip--ink">503 · Capacity</span>
    <button class="icon-btn theme-btn" id="theme-btn" type="button" title="切换到夜间" aria-label="切换日间夜间模式"><svg class="ic"><use href="#i-moon"/></svg></button>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="grid">
      <div class="code mono muted">02 / 满载</div>

      <section class="body" aria-live="polite">
        <div class="wait">
          <h1>所有工作区<br>都在使用中。</h1>
          <p class="lede">为了保证每位访客的工作区独立且流畅，我们限制了同时在线人数。现在暂时无法提供更多服务，请稍等片刻，空出位置后会自动为你接入。</p>
          <div class="count">
            <div class="label" id="count-label">距离下次自动重试</div>
            <div class="count__num" id="count">--:--</div>
            <div class="track"><i id="track"></i></div>
          </div>
          <div class="actions">
            <button class="btn btn--primary" id="retry">立即重试</button>
            <label class="check"><input type="checkbox" id="auto" checked> 自动重试</label>
            <a class="btn btn--ghost" href="index.html" id="home"><svg class="ic"><use href="#i-arrow-l"/></svg> 返回首页</a>
          </div>
        </div>
        <div class="ok">
          <h1>有空位了。</h1>
          <p class="lede" id="ok-msg">工作区已为你保留，正在进入…</p>
          <div class="actions"><a class="btn btn--primary" href="index.html?continue=1">进入工作区 <svg class="ic"><use href="#i-arrow-r"/></svg></a></div>
        </div>
      </section>

      <aside class="side">
        <div class="label">工作区池</div>
        <div class="slots" id="slots" aria-hidden="true"></div>
        <div class="legend"><span>使用中</span><span class="l-drain">回收中</span><span class="l-free">空闲</span></div>
        <dl style="margin-top:20px">
          <div class="row"><dt>同时在线上限</dt><dd id="d-total">–</dd></div>
          <div class="row"><dt>正在使用</dt><dd id="d-active">–</dd></div>
          <div class="row"><dt>回收中</dt><dd id="d-drain">–</dd></div>
          <div class="row"><dt>已尝试</dt><dd id="d-tries">0 次</dd></div>
          <div class="row"><dt>最近一次</dt><dd id="d-last">–</dd></div>
        </dl>
        <p class="muted" style="font-size:12px;margin:16px 0 0">试用到期或访客主动结束后，工作区会被自动回收并空出。</p>
      </aside>
    </div>
  </div>
</main>

<footer><div class="wrap"><span>TutorLM · Techathon 2026</span><span style="margin-left:auto" class="mono">HTTP 503 · Retry-After</span></div></footer>

<script src="assets/common.js"></script>
<script src="assets/api.js"></script>
<script src="assets/entry.js"></script>
</body>
</html>
