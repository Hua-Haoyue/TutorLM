# File-config deployment mode: the control plane is configured by a TOML file
# (CONTROL_PLANE_CONFIG), and Compose injects ONLY what a config file cannot
# express: the network/DB wiring and the Docker socket. This file deliberately
# does NOT set the policy values (slots, TTLs, tokens, invitation switches),
# so the file is authoritative instead of being silently overridden by a long
# list of fixed environment defaults.
#
# Why a separate file instead of `!reset`: overriding/`!reset` semantics need a
# newer Compose CLI than we can assume. Two independent files are portable and
# verifiable on any Compose v2.
#
# Usage:
#   docker compose -f runtime-host/deploy/compose.file.yml up -d --build
# with a .env (or exported vars) providing at least:
#   TUTORLM_CONFIG_FILE        absolute path to your TOML config (mounted read-only)
#   TUTORLM_INSTANCE_IMAGE     existing local application image
#   TUTORLM_FRONTEND_DIR       built frontend directory
#   TUTORLM_STACK_NAME         unique stack name (network/volume naming)
# and, if you keep secrets out of the TOML file, TUTORLM_CP_ADMIN_TOKEN /
# TUTORLM_CP_TOKEN_PEPPER (environment still wins over the file).
#
# Precedence: file < CONTROL_PLANE_* environment. Only the variables you set
# here (or in your .env) override the file; everything else comes from the file.

name: ${TUTORLM_STACK_NAME:-tutorlm-local}

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${TUTORLM_EDGE_BIND:-127.0.0.1}:${TUTORLM_EDGE_PORT:-47823}:80"
    volumes:
      - ../gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TUTORLM_FRONTEND_DIR:?Set TUTORLM_FRONTEND_DIR to built application frontend}:/usr/share/nginx/html:ro
    depends_on:
      control-plane:
        condition: service_healthy
    networks: [edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 4s
      retries: 3

  control-plane:
    image: tutorlm-control-plane:local
    build:
      context: ../control-plane
      dockerfile: ../deploy/Dockerfile.control-plane
    # Access to the Docker socket is host-root-equivalent, even from a container.
    user: "${TUTORLM_CP_USER:-0:0}"
    ports:
      - "127.0.0.1:${TUTORLM_CONTROL_PLANE_PORT:-47824}:8000"
    environment:
      # The single source of policy. The control plane reads this file itself.
      CONTROL_PLANE_CONFIG: /etc/tutorlm/control-plane.toml
      # DB path must live on the mounted volume, which the file cannot know.
      CONTROL_PLANE_DB_PATH: /data/control-plane.sqlite3
      # Non-negotiable for this deployment: talk to the local Docker daemon.
      CONTROL_PLANE_ADAPTER: docker
      # Stack-scoped resource naming, derived from TUTORLM_STACK_NAME.
      CONTROL_PLANE_NETWORK: ${TUTORLM_STACK_NAME:-tutorlm-local}-edge
      CONTROL_PLANE_CONTAINER_PREFIX: ${TUTORLM_STACK_NAME:-tutorlm-local}-slot
      CONTROL_PLANE_VOLUME_PREFIX: ${TUTORLM_STACK_NAME:-tutorlm-local}-slot-data-
      CONTROL_PLANE_LABEL_KEY: tutorlm.pool
      CONTROL_PLANE_LABEL_VALUE: ${TUTORLM_STACK_NAME:-tutorlm-local}
      # These two MUST be non-empty; fail loudly if unset rather than run with
      # an empty token/pepper. Put real values in .env or export them.
      CONTROL_PLANE_ADMIN_TOKEN: ${TUTORLM_CP_ADMIN_TOKEN:?Set a random admin token}
      CONTROL_PLANE_TOKEN_PEPPER: ${TUTORLM_CP_TOKEN_PEPPER:?Set a random token pepper}
      CONTROL_PLANE_LEASE_COOKIE_NAME: ${TUTORLM_STACK_NAME:-tutorlm-local}_lease
      # The application image is a runtime artifact that cannot be in a TOML
      # file's path-independent policy; keep it here.
      CONTROL_PLANE_INSTANCE_IMAGE: ${TUTORLM_INSTANCE_IMAGE:?Set an existing application image}
    volumes:
      - control-plane-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the TOML config read-only; nothing else on the host is exposed.
      - ${TUTORLM_CONFIG_FILE:?Set TUTORLM_CONFIG_FILE to the control-plane TOML file}:/etc/tutorlm/control-plane.toml:ro
    networks: [edge]
    restart: unless-stopped
    stop_grace_period: 30s

networks:
  edge:
    name: ${TUTORLM_STACK_NAME:-tutorlm-local}-edge

volumes:
  control-plane-data: