# Static UI belongs to the release, not an unallocated application slot.
server_tokens off;
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;
limit_req_zone $binary_remote_addr zone=lease_create:10m rate=15r/m;
log_format runtime_edge '$remote_addr $request_method $uri $status rt=$request_time';

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /dev/stdout runtime_edge;
    error_log /dev/stderr warn;
    client_max_body_size 3m;
    client_body_timeout 30s;
    set $control_upstream http://control-plane:8000;

    location = /healthz { access_log off; default_type text/plain; return 200 'edge-ok\n'; }
    location ^~ /control/admin/ { return 403; }
    location = /control/leases {
        limit_req zone=lease_create burst=8 nodelay;
        limit_req_status 429;
        proxy_pass $control_upstream;
        proxy_read_timeout 90s;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control 'no-store' always;
    }
    location ~ ^/control/users(?:/session)?$ {
        limit_req zone=lease_create burst=8 nodelay;
        limit_req_status 429;
        proxy_pass $control_upstream;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control 'no-store' always;
    }
    location /control/ {
        proxy_pass $control_upstream;
        proxy_read_timeout 90s;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control 'no-store' always;
    }
    location = /_lease_auth {
        internal;
        proxy_pass $control_upstream/control/admission;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Original-URI $request_uri;
    }
    location ~ ^/(api/|health$|health/ready$) {
        auth_request /_lease_auth;
        auth_request_set $lease_upstream $upstream_http_x_tutorlm_upstream;
        proxy_pass $lease_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie '';
        proxy_set_header X-User-ID '';
        proxy_set_header X-User-Token '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Tutorlm-Slot '';
        proxy_set_header X-Tutorlm-Upstream '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 240s;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control 'no-store' always;
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control 'no-cache, must-revalidate' always;
    }
}
